name: Byg web-image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - ".openai/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "next.config.ts"
      - "Dockerfile.web"
      - ".github/workflows/build-web-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: midtjysk-bilsyn-web-test
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Klargør Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Klargør flere processorarkitekturer
        uses: docker/setup-qemu-action@v3

      - name: Log ind i GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Byg og udgiv web-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/c4bex/midtjyskbilsyn-web:test
            ghcr.io/c4bex/midtjyskbilsyn-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/c4bex/midtjyskbilsyn
            org.opencontainers.image.revision=${{ github.sha }}
